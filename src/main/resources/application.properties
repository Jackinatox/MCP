spring.application.name=clu
spring.mvc.apiversion.use.path-segment=0
spring.mvc.apiversion.default=v1
logging.level.com.scyed.clu = trace

# Database profile: use 'sqlite' or 'postgres' (default: sqlite)
spring.profiles.active=sqlite

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=*

spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

scyed.eggs.directory=./eggs
scyed.gameserver.installTemp=./pt/installTemp
scyed.gameserver.user-uid=1001
scyed.gameserver.user-gid=1001

scyed.environment.gm-storage-dataset=blink/clu
scyed.environment.gm-storage-path=/blink/clu
scyed.environment.zfs-binary=/usr/sbin/zfs
